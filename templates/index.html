<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="../static/css/style.css">
  <title>Meme Creator</title>
</head>
<body>
  <header class="header">
    <img src="../static/img/logo.svg" alt="logo" width="50" height="50">
    <ul class="main-list">
        <li class="list__item">
          <a href="">Main Menu</a>
        </li>
        <li class="list__item">
          <a href="">Collection</a>
        </li>
        <li class="list__item">
          <a href="">Feedback</a>
        </li>
    </ul>
  </header>
  <main>
    {% block content %}
    <div class="form-block">
      <h1>Create your own Meme!</h1>
      <form method="POST" action="{{ url_for('index') }}">
        <ul class="form-list">
          <li class="form-list_item">
            <label for="image-selector">Meme Selector</label>
            <select name="image-selector" id="image-selector">
              <option value="logo.svg" {% if selected_image == 'logo.svg' %}selected{% endif %}>Select a Meme</option>
              <option value="meme_2.jpg" {% if selected_image == 'meme_2.jpg' %}selected{% endif %}>Nervous Options</option>
              <!--Görev #1. Yeni meme buraya ekleyin -->
              <option value="ww2soldier.png" {% if selected_image == 'ww2soldier.png' %}selected{% endif %}>scaredsoldier</option>
              <option value="watermeloncat.jpeg" {% if selected_image == 'watermeloncat.jpeg' %}selected{% endif %}>watermeloncat</option>
              <option value="backroomsmeme.jpg" {% if selected_image == 'backroomsmeme.jpg' %}selected{% endif %}>dancingbacteria</option>
            </select>
          </li>
          <li class="form-list_item">
            <label for="textTop">Enter Top Text</label>
            <input class="input_text" type="text" placeholder="Top text" name="textTop">
          </li>
          <li class="form-list_item">
            <label for="textBottom">Enter Bottom Text</label>
            <input class="input_text" type="text" placeholder="Bottom text" name="textBottom">
          </li>
          <li class="form-list_item">
            <label for="color-selector">Set Text Color</label>
            <select name="color-selector" id="color-selector">
              <option value="white" {% if selected_color == 'white' %}selected{% endif %}>White</option>
              <option value="black" {% if selected_color == 'black' %}selected{% endif %}>Black</option>
              <option value="green" {% if selected_color == 'green' %}selected{% endif %}>Green</option>
              <option value="red" {% if selected_color == 'red' %}selected{% endif %}>Red</option>
              <option value="purple" {% if selected_color == 'purple' %}selected{% endif %}>Purple</option>
              <option value="brown" {% if selected_color == 'brown' %}selected{% endif %}>Brown</option>
              <option value="yellow" {% if selected_color == 'yellow' %}selected{% endif %}>Yellow</option>
              <option value="blue" {% if selected_color == 'blue' %}selected{% endif %}>Blue</option>
              


            </select>
          </li>
          <li class="form-list_item">
            <label for="textTop_y">Enter the position of the top text on the Y axis</label>
            <input class="input_text" id="textTop_y" type="text" placeholder="Top text" name="textTop_y">
          </li>
          <li class="form-list_item">
            <label for="textBottom_y">Enter the position of the bottom text on the Y axis</label>
            <input class="input_text" id="textBottom_y" type="text" placeholder="Bottom text" name="textBottom_y">
          </li>
          <button type="submit">Submit your Meme</button>
        </ul>
      </form>
    </div>
    <div class="meme-block" id="memeBlock">
      
      <p class="text_top" style="color: {{selected_color}}; top: {{text_top_y}}px;">
        {{text_top}}
      </p>

      <img class="meme" src="{{ url_for('serve_images', path=selected_image) }}" alt="{{ selected_image }}">

      <p class="text_bottom" style="color: {{selected_color}}; bottom: {{text_bottom_y}}px;">
        {{text_bottom}}
      </p>
    </div>
    {% endblock %}
  </main>
  <footer>

  </footer>
</body>
</html>
